name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: Integration (${{ matrix.adapter }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        adapter: [postgres, opensearch]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Configure OpenSearch kernel prerequisite
        if: matrix.adapter == 'opensearch'
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Run integration tests
        run: npm run test:${{ matrix.adapter }} -- --reporter=verbose
